plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

// Port personal a Forge 1.20.1 de Ecstatic (CC-BY-NC-SA-4.0, Wizardtastic / angryalchemist).
// Origen: github.com/Wizardtastic/Ecstatic (febfb72, NeoForge 1.21.1, v1.4.1). NO publicar.
version = '1.4.1-forge1.20.1-port'
group = 'com.angryalchemist'
base { archivesName = 'ecstatic' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

jarJar.enable()

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            property 'ecstatic.autotest', project.findProperty('autotest') ?: 'true'
            jvmArgs '-Xmx3G'
            mods { ecstatic { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, 'ecstatic.refmap.json'
    config 'ecstatic.mixins.json'
}

repositories {
    mavenCentral()
    flatDir { dir 'libs-test' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Solo para probar compatibilidad en runClient (-PconMods): mods del pack
    if (project.hasProperty('conMods')) {
        runtimeOnly fg.deobf('local:embeddium:0.3.31+mc1.20.1')
        runtimeOnly fg.deobf('local:oculus:mc1.20.1-1.8.0')
    }

    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
    }
}

tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('jarJar') { archiveClassifier = '' }
reobf { jarJar { } }
tasks.named('build') { dependsOn 'reobfJarJar' }

tasks.withType(Jar).configureEach {
    manifest {
        attributes([
            'Specification-Title'   : 'ecstatic',
            'Specification-Vendor'  : 'angryalchemist (Wizardtastic)',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'ecstatic.mixins.json'
        ])
    }
}
