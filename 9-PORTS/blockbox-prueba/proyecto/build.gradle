plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

// Port personal a Forge 1.20.1 de The Block Box (vectorwing). Codigo MIT, texturas/sonidos
// CC BY-NC 4.0. Origen: github.com/vectorwing/BlockBox, rama 1.21.1. Ver LEEME-port.txt.
version = '0.1.3-forge1.20.1-port'
group = 'vectorwing.blockbox'
base { archivesName = 'blockbox' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

mixin {
    add sourceSets.main, 'blockbox.refmap.json'
    config 'blockbox.mixins.json'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'blockbox',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'blockbox.mixins.json'
        ])
    }
}
